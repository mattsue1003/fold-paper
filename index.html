<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>摺紙紙本生成器｜可調式紙本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--ink:#2A2622;--muted:#7A6B5C;--accent:#E8552D;--accent-ink:#FFFFFF;--amber:#F4A93C;--desk:#FFF6EC;--line:#F0E0CE;--card:#FFFFFF;--chip:#FFF1E4;--on:#FFE6D6;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1916;--ink:#F3ECE4;--muted:#B9A999;--desk:#27211C;--line:#3C332B;--card:#25201C;--chip:#352920;--on:#4A2E20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1D1916;--ink:#F3ECE4;--muted:#B9A999;--desk:#27211C;--line:#3C332B;--card:#25201C;--chip:#352920;--on:#4A2E20;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.top{padding:28px 32px 22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
.fold{width:64px;height:64px;flex:none;position:relative}
.fold i{position:absolute;inset:0;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.fold b{position:absolute;inset:0;background:var(--amber);clip-path:polygon(0 0,100% 0,0 100%);transform-origin:50% 50%;animation:flap 1.1s .3s cubic-bezier(.5,0,.2,1) both}
@keyframes flap{from{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);opacity:.0}to{clip-path:polygon(0 0,100% 0,0 100%);opacity:1}}
@media (prefers-reduced-motion:reduce){.fold b{animation:none}}
.brand .tag{display:inline-block;font-size:13px;font-weight:700;color:var(--accent);background:var(--chip);padding:2px 10px;border-radius:99px}
.brand h1{margin:6px 0 2px;font-size:clamp(28px,4vw,40px);font-weight:900;letter-spacing:.02em;line-height:1.15}
.brand p{margin:0;color:var(--muted);font-size:16px}
.wrap{display:grid;grid-template-columns:minmax(330px,420px) 1fr;min-height:calc(100vh - 140px)}
.panel{padding:20px 24px 40px;border-right:1px solid var(--line)}
.panel section{padding:16px 0;border-bottom:1px dashed var(--line)}
.panel section:last-child{border-bottom:0}
.panel h2{font-size:17px;margin:0 0 10px;font-weight:900}
.panel h3{font-size:14px;margin:12px 0 6px;color:var(--muted);font-weight:700}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.mini{border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;cursor:pointer;padding:4px 6px}
.lvhead{font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 6px}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mcard{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;transition:border-color .15s,background .15s}
.mcard canvas{background:#fff;border-radius:8px}
.mcard .mname{font-size:15px;font-weight:700}
.mcard .msteps{font-size:12px;color:var(--muted)}
.mcard.on{border-color:var(--accent);background:var(--on)}
.mcard:focus-visible,.segb:focus-visible,.sw:focus-visible,.dlb:focus-visible,.mini:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.checks{display:flex;gap:10px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:8px;padding:8px 14px;border:1.5px solid var(--line);border-radius:10px;font-weight:700;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:5px 14px;cursor:pointer;font-size:14px}
.segb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.opts{padding-left:12px;border-left:3px solid var(--chip);margin-top:6px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;cursor:pointer;font-size:12px;color:var(--muted);padding:0}
.sw::before{content:"";width:34px;height:34px;border-radius:8px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transform:rotate(45deg) scale(.8)}
.sw.on::before{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.sw.on{color:var(--ink);font-weight:700}
label.field{display:block;font-size:14px;color:var(--muted);margin:4px 0}
input[type=text]{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.dl{}
.dlb{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border:0;border-radius:12px;padding:11px 16px;margin-bottom:8px;cursor:pointer;background:var(--chip)}
.dlb b{font-size:16px}
.dlb span{font-size:13px;color:var(--muted)}
.dlb.main{background:var(--accent);color:var(--accent-ink)}
.dlb.main span{color:#FFE3D6}
.dlb:disabled{opacity:.45;cursor:not-allowed}
#status{min-height:1.4em;font-size:14px;color:var(--muted);margin:4px 2px 0}
.desk{background:var(--desk);padding:18px 20px 40px;min-width:0}
.deskbar{font-size:14px;color:var(--muted);margin:0 0 12px 4px;font-weight:700;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#pages{display:flex;flex-direction:column;align-items:center;gap:22px}
.sheet{margin:0}
.sheet canvas{display:block;background:#fff;box-shadow:0 1px 2px rgba(80,50,20,.12),0 8px 24px rgba(80,50,20,.10);border-radius:2px}
.sheet figcaption{text-align:center;font-size:13px;color:var(--muted);margin-top:6px}
.empty{padding:60px 20px;color:var(--muted);text-align:center;max-width:320px}

.playsec{background:var(--chip);margin:8px -12px;padding:14px 12px!important;border-radius:14px;border-bottom:0!important}
.playlist{display:flex;flex-wrap:wrap;gap:8px}
.playb{border:0;background:var(--accent);color:#fff;font-weight:700;font-size:15px;border-radius:99px;padding:8px 16px;cursor:pointer}
.playb:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.hint2{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
#player{position:fixed;inset:0;z-index:50;background:#FFF6EC;color:#2A2622;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#player[hidden]{display:none}
.pl-top{display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap}
.pl-title{font-size:clamp(20px,2.4vw,32px);font-weight:900}
.pl-dots{display:flex;align-items:center;gap:6px;flex:1;flex-wrap:wrap}
.pl-dots i{width:14px;height:14px;border-radius:50%;background:#EAD9C6;display:inline-block}
.pl-dots i.past{background:#F4A93C}.pl-dots i.now{background:#E8552D;transform:scale(1.25)}
.pl-dots span{margin-left:8px;font-weight:700;color:#7A6B5C;font-size:18px}
.pl-tools{display:flex;gap:8px}
.pl-tools button{border:1.5px solid #E6D3BD;background:#fff;border-radius:99px;padding:6px 14px;font-size:15px;cursor:pointer;color:#2A2622}
.pl-main{flex:1;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:16px;padding:0 20px;min-height:0}
.pl-stage{background:#fff;border-radius:22px;box-shadow:0 6px 24px rgba(120,70,30,.10);min-height:0;position:relative}
.pl-stage canvas{position:absolute;inset:0}
.pl-side{display:flex;flex-direction:column;justify-content:center;gap:18px;padding:10px}
.pl-num{font-size:clamp(34px,4.6vw,72px);font-weight:900;color:#E8552D;line-height:1}
.pl-text{font-size:clamp(26px,3.3vw,54px);font-weight:900;line-height:1.35}
.pl-legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:clamp(14px,1.4vw,20px);color:#5A4E42}
.pl-legend i{display:inline-block;width:34px;height:0;border-top:3px dashed #1F5FAD;vertical-align:middle;margin-right:8px}
.pl-legend i.lm{border-top:3px dashed #C8321E}
.pl-bottom{display:flex;justify-content:center;gap:14px;padding:14px 20px 18px}
.pl-btn{border:0;border-radius:18px;padding:14px 34px;font-size:clamp(18px,2vw,28px);font-weight:900;cursor:pointer;background:#fff;color:#2A2622;box-shadow:0 3px 0 #E6D3BD}
.pl-btn.main{background:#E8552D;color:#fff;box-shadow:0 4px 0 #B8431F;min-width:200px}
.pl-btn.main.ready{animation:nudge 1.4s ease-in-out infinite}
.pl-btn:disabled{opacity:.4;cursor:not-allowed;animation:none}
.pl-btn:focus-visible,.pl-tools button:focus-visible{outline:3px solid #F4A93C;outline-offset:2px}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.pl-btn.main.ready{animation:none}}
@media (max-width:820px){.pl-main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.pl-side{gap:8px}.pl-btn{padding:12px 18px}}
footer{padding:18px 32px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
@media (max-width:860px){.wrap{grid-template-columns:1fr}.panel{border-right:0;border-bottom:1px solid var(--line)}.top{padding:22px 18px 16px}.panel{padding:12px 18px 24px}.desk{padding:14px 10px 30px}.mgrid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header class="top">
  <div class="fold" aria-hidden="true"><i></i><b></b></div>
  <div class="brand">
    <span class="tag">可調式紙本</span>
    <h1>摺紙紙本生成器</h1>
    <p>選好作品，印出步驟單和摺線紙，長輩照著線摺就好。</p>
  </div>
</header>
<div class="wrap">
  <aside class="panel">
    <section>
      <div class="row"><h2>1. 選作品</h2><span><button class="mini" id="selAll" type="button">全選</button><button class="mini" id="selNone" type="button">清除</button></span></div>
      <div id="models"></div>
    </section>
    <section class="playsec">
      <h2>動畫帶領（投影上課用）</h2>
      <div id="playList" class="playlist"></div>
      <div class="hint2">每一步都有摺紙動畫，播完會停住，等大家摺好再按「下一步」。可以用鍵盤左右鍵或簡報筆翻頁。</div>
    </section>
    <section>
      <h2>2. 要印哪些頁面</h2>
      <div class="checks">
        <label class="check"><input type="checkbox" id="ckSteps">步驟單</label>
        <label class="check"><input type="checkbox" id="ckCrease">摺線紙</label>
      </div>
      <div class="opts" id="stepOpts">
        <h3>步驟單：每頁幾步</h3><div class="seg" id="perSeg"></div>
        <h3>字級</h3><div class="seg" id="fsSeg"></div>
        <h3>說明文字</h3><div class="seg" id="txtSeg"></div>
      </div>
      <div class="opts" id="creaseOpts">
        <h3>摺線紙：每頁幾張</h3><div class="seg" id="copySeg"></div>
        <h3>底色</h3><div class="seg" id="bgSeg"></div>
        <h3>摺線範圍</h3><div class="seg" id="rangeSeg"></div>
      </div>
    </section>
    <section>
      <h2>3. 紙的顏色</h2>
      <div class="colors" id="colors"></div>
    </section>
    <section>
      <h2>4. 頁首</h2>
      <label class="field" for="unit">單位名稱（可不填）</label>
      <input type="text" id="unit" placeholder="例如：幸福社區關懷據點" maxlength="30">
      <div class="checks" style="margin-top:10px"><label class="check"><input type="checkbox" id="ckName">姓名、日期欄</label></div>
    </section>
    <section class="dl">
      <button class="dlb main" data-k="pptx" type="button"><b>下載 PPT</b><span>每個圖形、摺線、文字都能移動和修改</span></button>
      <button class="dlb" data-k="docx" type="button"><b>下載 Word</b><span>標題、說明文字可以修改</span></button>
      <button class="dlb" data-k="pdf" type="button"><b>下載 PDF</b><span>直接列印最方便</span></button>
      <div id="status" role="status"></div>
    </section>
  </aside>
  <main class="desk">
    <div class="deskbar"><span id="pcount"></span><span id="playTop" class="playlist"></span></div>
    <div id="pages"></div>
  </main>
</div>
<footer>設計｜愛迪樂 鍾孟修 職能治療師</footer>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const D = [50,0,100,50,50,100,0,50];
const SQ = [0,0,100,0,100,100,0,100];
const TRI_DN = [0,50,100,50,50,100];
const TRI_UP = [0,50,100,50,50,0];

// 杯子
const CG=[29.29,20.71], CQ=[70.71,20.71], CF=[41.42,50], CF2=[58.58,50];
const CUP_F1=[...CQ,...CG,...CF], CUP_F2=[...CG,...CQ,...CF2];
// 頭盔
const HD=[50,50,75,75,50,100,25,75];
// 愛心
const HEART_A=[37.5,12.5,50,25,62.5,12.5,81.25,31.25,50,62.5,18.75,31.25];
const HEART_B=[41.74,16.74,50,25,58.26,16.74,66.74,16.74,77,27,77,35.5,50,62.5,23,35.5,23,27,33.26,16.74];
// 紙盒
const BL=14.64, BH=85.36, BA=32.32, BB=67.68;
const BRQ=[BL,BL,BH,BL,BH,BH,BL,BH];
const BHEX=[50,-20.71,BH,BL,BH,BH,50,120.71,BL,BH,BL,BL];
const BOXCR=(()=>{
  const seg=[['v',37.5,12.5,87.5,62.5],['m',37.5,12.5,25,0],['m',75,0,100,25],['m',87.5,62.5,100,75]];
  const out=[]; let cur=seg;
  for(let i=0;i<4;i++){
    cur.forEach(s=>out.push([s[0],s[1],s[2],s[3],s[4],3]));
    cur=cur.map(s=>[s[0],100-s[2],s[1],100-s[4],s[3]]);
  }
  return out;
})();
// 跳跳蛙
const FR=[0,0,50,0,50,100,0,100];
const FTRI=[0,50,50,50,25,25];
const FDIA=[12.5,37.5,25,25,37.5,37.5,25,50];
// 紙鶴
const PB=[50,15,85,50,50,85,15,50];
const PETAL=[50,-14,70.5,35.5,50,85,29.5,35.5];

const WB=[0,100,100,100,50,50];            // 水雷基本形（三角形）
const WBD=[25,75,50,50,75,75,50,100];      // 前後兩角摺上去後的菱形
const KITE_DN=[50,0,79.29,29.29,50,100,20.71,29.29], KDF1=[50,29.29,20.71,29.29,50,100], KDF2=[50,29.29,79.29,29.29,50,100];
const KITE_UP=[50,0,79.29,70.71,50,100,20.71,70.71], KUF1=[50,70.71,20.71,70.71,50,0], KUF2=[50,70.71,79.29,70.71,50,0];
const HW=70.71, HC=35.35;                   // 紙帽子用 A4 直式
const SHIRT=[25,10,75,10,75,100,74,100,50,62,26,100,25,100];
const BAL6=[37.5,62.5,50,50,62.5,62.5,62.5,87.5,50,100,37.5,87.5];
const CROSS_CREASE=(t)=>({t,sh:[['w',SQ]],ln:[['v',0,50,100,50]],ar:[[72,5,72,95,-.25,'f']]});
const VERT_CREASE_D={t:'菱形擺放，白色面朝上。左右對摺壓出中線，再打開',sh:[['w',D]],ln:[['v',50,0,50,100]],ar:[[5,50,95,50,-.3,'f']]};
const UPPER_KITE={t:'上面左右兩邊往中線摺',sh:[['w',D]],ln:[['x',50,0,50,100],['v',50,0,20.71,70.71],['v',50,0,79.29,70.71]],ar:[[3,48,44,45,-.4,'f'],[97,48,56,45,.4,'f']]};
const LOWER_KITE={t:'下面左右兩邊往中線摺',sh:[['w',D]],ln:[['x',50,0,50,100],['v',50,100,20.71,29.29],['v',50,100,79.29,29.29]],ar:[[3,52,44,55,.4,'f'],[97,52,56,55,-.4,'f']]};
const FOUR_IN=(sh,b)=>({t:'四個角再往中心點摺一次',sh,ln:[['x',0,50,100,50],['x',50,0,50,100],['v',25,25,75,25],['v',75,25,75,75],['v',75,75,25,75],['v',25,75,25,25]],ar:[[50,4,50,44,-b,'f'],[96,50,56,50,-b,'f'],[50,96,50,56,-b,'f'],[4,50,44,50,-b,'f']]});
const WB_S2={t:'翻到背面。上下對摺壓線，再打開',flip:1,sh:[['c',SQ]],ln:[['x',0,0,100,100],['x',100,0,0,100],['v',0,50,100,50]],ar:[[72,5,72,95,-.25,'f']]};
const WB_S3={t:'沿著摺線，左右兩邊往內壓，上半部往下收成三角形',sh:[['c',SQ]],ln:[['x',0,0,100,100],['x',100,0,0,100],['x',0,50,100,50]],ar:[[-3,50,16,50,0,'p'],[103,50,84,50,0,'p'],[36,4,36,46,-.3,'f']]};
const WB_S4={t:'前面兩個角往上摺到頂端',sh:[['c',WB]],ln:[['v',25,75,50,100],['v',75,75,50,100]],ar:[[3,98,46,54,-.35,'f'],[97,98,54,54,.35,'f']],vb:[-4,44,108,62]};
function petal(a,len,w){const r=a*Math.PI/180,c=Math.cos(r),s=Math.sin(r),mx=50+len*.55*c,my=50+len*.55*s;return [50,50,mx-s*w,my+c*w,50+len*c,50+len*s,mx+s*w,my-c*w];}
function fanPts(){const p=[50,88];for(let a=200;a<=340;a+=20){const r=a*Math.PI/180;p.push(50+45*Math.cos(r),88+45*Math.sin(r));}return p;}
const FAN=fanPts();
function fanRibs(){const out=[];for(let i=2;i<FAN.length;i+=2)out.push(['e',50,88,FAN[i],FAN[i+1]]);return out;}

// ===== 摺紙模擬：紙片（facet）＋ 正反面 ＋ 層次 =====
// facet: {pts:[x,y,...], M: 原紙座標→目前座標 的仿射（null = 不再追蹤）, up: 白色面朝上?, z: 層次, tags:[], fill: 指定顏色（關鍵影格用）}
function aApply(M,x,y){return [M[0]*x+M[1]*y+M[4],M[2]*x+M[3]*y+M[5]];}
function aComp(A,B){return [A[0]*B[0]+A[1]*B[2],A[0]*B[1]+A[1]*B[3],A[2]*B[0]+A[3]*B[2],A[2]*B[1]+A[3]*B[3],A[0]*B[4]+A[1]*B[5]+A[4],A[2]*B[4]+A[3]*B[5]+A[5]];}
function aInv(M){const det=M[0]*M[3]-M[1]*M[2],a=M[3]/det,b=-M[1]/det,c=-M[2]/det,d=M[0]/det;return [a,b,c,d,-(a*M[4]+b*M[5]),-(c*M[4]+d*M[5])];}
function aRefl(ax,ay,bx,by){const dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,a=2*ux*ux-1,b=2*ux*uy,d=2*uy*uy-1;return [a,b,b,d,ax-(a*ax+b*ay),ay-(b*ax+d*ay)];}
function mapPts(M,p){const q=[];for(let i=0;i<p.length;i+=2){const r=aApply(M,p[i],p[i+1]);q.push(r[0],r[1]);}return q;}
function cen(p){let x=0,y=0;const n=p.length/2;for(let i=0;i<p.length;i+=2){x+=p[i];y+=p[i+1];}return [x/n,y/n];}
function area(p){let s=0;for(let i=0;i<p.length;i+=2){const j=(i+2)%p.length;s+=p[i]*p[j+1]-p[j]*p[i+1];}return Math.abs(s)/2;}
function cr2(ax,ay,bx,by){return ax*by-ay*bx;}
function clipH(pts,A,d,sign){
  const out=[];const n=pts.length/2;
  const sd=i=>cr2(d[0],d[1],pts[2*i]-A[0],pts[2*i+1]-A[1])*sign;
  for(let i=0;i<n;i++){
    const j=(i+1)%n,sa=sd(i),sb=sd(j);
    if(sa>=-1e-9) out.push(pts[2*i],pts[2*i+1]);
    if((sa>1e-9&&sb<-1e-9)||(sa<-1e-9&&sb>1e-9)){const t=sa/(sa-sb);out.push(pts[2*i]+(pts[2*j]-pts[2*i])*t,pts[2*i+1]+(pts[2*j+1]-pts[2*i+1])*t);}
  }
  return out.length>=6&&area(out)>.02?out:null;
}
function lineInPoly(A,d,pts){ // 回傳直線在多邊形內的參數範圍
  let lo=Infinity,hi=-Infinity;const n=pts.length/2;
  for(let i=0;i<n;i++){
    const j=(i+1)%n,p=[pts[2*i],pts[2*i+1]],q=[pts[2*j],pts[2*j+1]],e=[q[0]-p[0],q[1]-p[1]];
    const den=cr2(d[0],d[1],e[0],e[1]);
    if(Math.abs(den)<1e-12) continue;
    const w=[p[0]-A[0],p[1]-A[1]],t=cr2(w[0],w[1],e[0],e[1])/den,s=cr2(w[0],w[1],d[0],d[1])/den;
    if(s>=-1e-9&&s<=1+1e-9){lo=Math.min(lo,t);hi=Math.max(hi,t);}
  }
  return hi-lo>1e-6?[lo,hi]:null;
}
function cloneState(S){return {f:S.f.map(f=>({...f,pts:f.pts.slice(),tags:f.tags.slice()})),track:S.track,pre:S.pre.slice(),up0:S.up0};}
function initState(poly,up=true){return {f:[{pts:poly.slice(),M:[1,0,0,1,0,0],up,z:0,tags:[]}],track:true,pre:[]};}
function bboxOf(fs){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;fs.forEach(f=>{for(let i=0;i<f.pts.length;i+=2){x0=Math.min(x0,f.pts[i]);x1=Math.max(x1,f.pts[i]);y0=Math.min(y0,f.pts[i+1]);y1=Math.max(y1,f.pts[i+1]);}});return [x0,y0,x1,y1];}
function info(f){return {oc:f.M?cen(mapPts(aInv(f.M),f.pts)):null,cc:cen(f.pts),tags:f.tags,z:f.z,up:f.up,has:t=>f.tags.includes(t)};}
function normZ(S){S.f.sort((a,b)=>a.z-b.z);S.f.forEach((f,i)=>f.z=i);}

// 摺一下：回傳 {moving:[{old,neu}], creases:[...]}；unfold 時不改變狀態
function opFold(S,op,stepNo){
  const A=[op[1],op[2]],d=[op[3]-op[1],op[4]-op[2]],P=[op[5],op[6]],dir=op[7],o=op[8]||{};
  const side=Math.sign(cr2(d[0],d[1],P[0]-A[0],P[1]-A[1]));
  const R=aRefl(op[1],op[2],op[3],op[4]);
  const keep=[],mov=[],creases=[];
  S.f.forEach(f=>{
    if(o.sel&&!o.sel(info(f))){keep.push(f);return;}
    const a=clipH(f.pts,A,d,side),b=clipH(f.pts,A,d,-side);
    if(a&&b&&S.track&&f.M){
      const r=lineInPoly(A,d,f.pts);
      if(r){const Mi=aInv(f.M),p=aApply(Mi,A[0]+d[0]*r[0],A[1]+d[1]*r[0]),q=aApply(Mi,A[0]+d[0]*r[1],A[1]+d[1]*r[1]);
        creases.push([((dir==='v')===(f.up===(S.up0!==false)))?'v':'m',p[0],p[1],q[0],q[1],stepNo]);}
    }
    if(b) keep.push(a?{...f,pts:b,tags:f.tags.slice()}:f);
    if(a) mov.push(b?{...f,pts:a,tags:f.tags.slice()}:f);
  });
  if(o.unfold||!mov.length) return {keep,mov,creases,res:null};
  const zs=S.f.map(f=>f.z),zmax=Math.max(...zs),zmin=Math.min(...zs);
  const mz=mov.map(f=>f.z),mmax=Math.max(...mz),mmin=Math.min(...mz);
  let base=null;
  if(o.under){const t=keep.filter(f=>f.tags.includes(o.under)).map(f=>f.z);if(t.length)base=Math.min(...t);}
  const neu=mov.map(f=>{
    let z;
    if(base!==null) z=base-.5+(mmax-f.z)*.001;
    else if(dir==='v') z=zmax+1+(mmax-f.z);
    else z=zmin-1-(f.z-mmin);
    return {...f,pts:mapPts(R,f.pts),M:f.M?aComp(R,f.M):null,up:!f.up,z,tags:o.tag?[...f.tags,o.tag]:f.tags.slice(),fill:f.fill?(f.back||swapFill(f.fill)):null,back:f.fill||null};
  });
  return {keep,mov,neu,creases};
}
function opFlip(S){const b=bboxOf(S.f),cx=(b[0]+b[2])/2,F=[-1,0,0,1,2*cx,0];
  S.f.forEach(f=>{f.pts=mapPts(F,f.pts);if(f.M)f.M=aComp(F,f.M);f.up=!f.up;f.z=-f.z;if(f.fill){const b=f.back||swapFill(f.fill);f.back=f.fill;f.fill=b;}});normZ(S);return cx;}
function swapFill(f){return {w:'c',c:'w',w2:'c2',c2:'w2'}[f]||f;}
function opRot(S,deg){const b=bboxOf(S.f),cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2,r=deg*Math.PI/180,c=Math.cos(r),s=Math.sin(r);
  const M=[c,-s,s,c,cx-c*cx+s*cy,cy-s*cx-c*cy];S.f.forEach(f=>{f.pts=mapPts(M,f.pts);if(f.M)f.M=aComp(M,f.M);});return {cx,cy};}
function opKey(S,shapes){S.f=shapes.map(([fill,pts,tag,back],i)=>({pts:pts.slice(),M:null,up:fill[0]==='w',z:i,tags:tag?[tag]:[],fill,back:back||swapFill(fill)}));S.track=false;S.pre=[];}
function applyOp(S,op,stepNo,log){
  if(op[0]==='f'){const r=opFold(S,op,stepNo);if(log)log.push(...r.creases);
    if(op[8]&&op[8].unfold){if(S.track)r.creases.forEach(c=>S.pre.push(c));return r;}
    if(r.neu){S.f=[...r.keep,...r.neu];normZ(S);}return r;}
  if(op[0]==='flip') return opFlip(S);
  if(op[0]==='rot') return opRot(S,op[1]);
  if(op[0]==='key') return opKey(S,op[1]);
}
function stateShapes(S){return S.f.slice().sort((a,b)=>a.z-b.z).map(f=>[f.fill||(f.up?'w':'c'),f.pts]);}
function inPolyP(x,y,p){let c=false;for(let i=0,j=p.length-2;i<p.length;j=i,i+=2){const xi=p[i],yi=p[i+1],xj=p[j],yj=p[j+1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
function preLines(S,only){ // 先前壓好的摺痕（虛的灰線），只畫在最上面看得到的紙上
  if(!S.track) return [];
  const out=[];const fs=only||S.f;
  fs.forEach(f=>{if(!f.M)return;const Mi=aInv(f.M),op=mapPts(Mi,f.pts);
    S.pre.forEach(c=>{const A=[c[1],c[2]],d=[c[3]-c[1],c[4]-c[2]],r=lineInPoly(A,d,op);if(!r)return;
      const lo=Math.max(0,r[0]),hi=Math.min(1,r[1]);if(hi-lo<1e-3)return;
      const p=aApply(f.M,A[0]+d[0]*lo,A[1]+d[1]*lo),q=aApply(f.M,A[0]+d[0]*hi,A[1]+d[1]*hi),mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2;
      if(fs.some(g=>g!==f&&g.z>f.z&&inPolyP(mx,my,g.pts)))return;
      out.push(['x',p[0],p[1],q[0],q[1]]);});});
  return out;
}

// ---- 把作品的 ops 編譯成「每一步的圖」+ 摺線紙
function compileModel(m){
  if(m._c) return;
  let S=initState(m.paper,m.up0!==false);
  const steps=[],creases=[],states=[];
  m.raw.forEach((st,k)=>{
    const ops=st.ops||[];
    // 開頭的翻面／旋轉先套用在圖上
    let lead=0;S.up0=m.up0;const S0=cloneState(S);
    while(lead<ops.length&&(ops[lead][0]==='flip'||ops[lead][0]==='rot')){applyOp(S0,ops[lead],k+1);lead++;}
    const disp={t:st.t,sh:stateShapes(S0),ln:[...preLines(S0)],ar:[],flip:ops[0]&&ops[0][0]==='flip'?1:0,done:st.done?1:0,dots:st.dots||null};
    if(st.done&&st.final){disp.sh=st.final;}
    if(st.ln) disp.ln.push(...st.ln);
    // 依序模擬，收集摺線與箭頭
    const Sx=cloneState(S0);let keyLn=null;
    for(let i=lead;i<ops.length;i++){
      const op=ops[i];
      if(op[0]==='f'){
        const pre=cloneState(Sx);const r=applyOp(Sx,op,k+1,creases);
        const A=[op[1],op[2]],d=[op[3]-op[1],op[4]-op[2]];let lo=Infinity,hi=-Infinity;
        (r.mov||[]).concat(r.keep||[]).forEach(f=>{const q=lineInPoly(A,d,f.pts);if(q&&(r.mov.includes(f)||clipH(f.pts,A,d,1)&&clipH(f.pts,A,d,-1))){lo=Math.min(lo,q[0]);hi=Math.max(hi,q[1]);}});
        (r.mov||[]).forEach(f=>{const q=lineInPoly(A,d,f.pts);if(q){lo=Math.min(lo,q[0]);hi=Math.max(hi,q[1]);}});
        if(isFinite(lo)) disp.ln.push([op[7],A[0]+d[0]*lo,A[1]+d[1]*lo,A[0]+d[0]*hi,A[1]+d[1]*hi]);
        // 箭頭：從要動的紙片尖端到摺過去的位置
        if(r.mov&&r.mov.length&&!(op[8]&&op[8].noArrow)){
          const R=aRefl(op[1],op[2],op[3],op[4]);
          const L0=Math.hypot(d[0],d[1]),nn=[-d[1]/L0,d[0]/L0];let P=[op[5],op[6]],best=-1;
          r.mov.forEach(f=>{for(let j=0;j<f.pts.length;j+=2){const sd=Math.abs((f.pts[j]-A[0])*nn[0]+(f.pts[j+1]-A[1])*nn[1]);if(sd>best+1e-6){best=sd;P=[f.pts[j],f.pts[j+1]];}}});
          {const sd=(P[0]-A[0])*nn[0]+(P[1]-A[1])*nn[1];P=[P[0]-nn[0]*sd*.12,P[1]-nn[1]*sd*.12];}
          const Q=aApply(R,P[0],P[1]);
          const b=bboxOf(pre.f),C=[(b[0]+b[2])/2,(b[1]+b[3])/2];
          const mx=(P[0]+Q[0])/2,my=(P[1]+Q[1])/2,dx=Q[0]-P[0],dy=Q[1]-P[1];
          const bend=.3,c1=[mx-dy*bend,my+dx*bend],c2=[mx+dy*bend,my-dx*bend];
          const s=Math.hypot(c1[0]-C[0],c1[1]-C[1])>Math.hypot(c2[0]-C[0],c2[1]-C[1])?bend:-bend;
          const P2=P,Q2=[Q[0]-dx*.06,Q[1]-dy*.06];
          disp.ar.push([P2[0],P2[1],Q2[0],Q2[1],s,op[7]==='m'?'m':'f']);
        }
      }else if(op[0]==='key'){
        if(op[2]){if(op[2].ln)disp.ln.push(...op[2].ln);if(op[2].ar)disp.ar.push(...op[2].ar);}
        applyOp(Sx,op,k+1);
      }else applyOp(Sx,op,k+1);
    }
    states.push(cloneState(S));
    steps.push({disp,ops,lead,after:cloneState(Sx)});
    S=Sx;
  });
  // 視窗範圍
  steps.forEach((s,k)=>{
    const pts=[];s.disp.sh.forEach(([f,p])=>pts.push(...p));
    if(!s.disp.done) stateShapes(s.after).forEach(([f,p])=>pts.push(...p));
    s.disp.ar.forEach(a=>pts.push(a[0],a[1],a[2],a[3],(a[0]+a[2])/2-(a[3]-a[1])*a[4],(a[1]+a[3])/2+(a[2]-a[0])*a[4]));
    s.disp.ln.forEach(l=>pts.push(l[1],l[2],l[3],l[4]));
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(let i=0;i<pts.length;i+=2){x0=Math.min(x0,pts[i]);x1=Math.max(x1,pts[i]);y0=Math.min(y0,pts[i+1]);y1=Math.max(y1,pts[i+1]);}
    const w=x1-x0,h=y1-y0,sz=Math.max(w,h,20)*1.1,cx=(x0+x1)/2,cy=(y0+y1)/2;
    s.disp.vb=[cx-sz/2,cy-sz/2,sz,sz];
  });
  m.steps=steps.map(s=>s.disp);
  m.sim=steps;m.states=states;
  const cr=[];creases.forEach(c=>{if(Math.hypot(c[3]-c[1],c[4]-c[2])<.5)return;
    if(cr.some(e=>(Math.hypot(e[1]-c[1],e[2]-c[2])<.3&&Math.hypot(e[3]-c[3],e[4]-c[4])<.3)||(Math.hypot(e[1]-c[3],e[2]-c[4])<.3&&Math.hypot(e[3]-c[1],e[4]-c[2])<.3)))return;cr.push(c);});
  (m.extraCr||[]).forEach(c=>cr.push(c));
  m.cr=cr;
  m.vb=m.steps[0].vb;
  m._c=1;
}

const LV={1:'入門',2:'中等',3:'進階'};

// ===== 繪圖核心：所有頁面先變成 mm 單位的圖元，再交給畫布或 PPT =====
const FONT='"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif';
const INK='#2A2622', ORANGE='#E8552D', AMBER='#F4A93C';
const LINECOL={v:'#1F5FAD',m:'#C8321E',x:'#B3AAA0',e:'#4A4540'};
const DASH={v:[2.4,1.4],m:[2.6,1,.55,1]};
const DASHNAME={v:'dash',m:'lgDashDot'};

function hexRgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16));}
function rgbHex(a){return '#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('').toUpperCase();}
function mix(a,b,f){const x=hexRgb(a),y=hexRgb(b);return rgbHex(x.map((v,i)=>v+(y[i]-v)*f));}
function fillOf(k,color){return {w:'#FFFFFF',w2:'#ECE6DE',c:color,c2:mix(color,'#000000',.16)}[k];}
function d2s(x,y){const qx=x-50,qy=y-50;return [50+qx+qy,50+qy-qx];}

let _mctx=null;
function mctx(){if(!_mctx)_mctx=document.createElement('canvas').getContext('2d');return _mctx;}
function fontStr(px,bold){return `${bold?700:400} ${px}px ${FONT}`;}
function textW(t,s,b){const c=mctx();c.font=fontStr(100,b);return c.measureText(t).width*s/100;}
const NOSTART='，。！？、；：）」』';
function wrap(t,w,s,b){
  const out=[];
  for(const para of String(t).split('\n')){
    let cur='';
    for(const ch of Array.from(para)){
      if(cur&&textW(cur+ch,s,b)>w){
        if(NOSTART.includes(ch)&&cur.length>1){out.push(cur.slice(0,-1));cur=cur.slice(-1)+ch;}
        else{out.push(cur);cur=ch;}
      }else cur+=ch;
    }
    out.push(cur);
  }
  const L=out.length;
  if(L>1&&Array.from(out[L-1]).length===1&&Array.from(out[L-2]).length>2){const a=Array.from(out[L-2]);out[L-1]=a.pop()+out[L-1];out[L-2]=a.join('');}
  return out;
}

// ---- 箭頭與翻面圖示
function arrowPrim(x1,y1,x2,y2,bend,kind,sw,hs){
  const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1;
  const cx=mx-dy*bend,cy=my+dx*bend;
  const segs=bend===0?[[x1,y1],[x2,y2]]:[[x1,y1],[cx,cy,x2,y2]];
  return {k:'path',segs,stroke:kind==='p'?'#333333':'#2F2F2F',sw:kind==='p'?sw*1.5:sw,head:kind==='m'?'open':'fill',hs};
}
function circArrow(cx,cy,r,sw,hs){
  const segs=[];const a0=-50,a1=230,n=3,st=(a1-a0)/n;
  const P=a=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];
  segs.push(P(a0));
  for(let i=0;i<n;i++){const am=a0+st*(i+.5),a2=a0+st*(i+1),rr=r/Math.cos(st/2*Math.PI/180);
    segs.push([cx+rr*Math.cos(am*Math.PI/180),cy+rr*Math.sin(am*Math.PI/180),...P(a2)]);}
  return {k:'path',segs,stroke:ORANGE,sw,head:'fill',hs};
}
function flipBadge(x,y,s){ // 右上角的「翻面」標籤，s = 字高 mm
  const w=s*4.2,h=s*1.9;
  return [
    {k:'rect',x,y,w,h,r:h/2,fill:'#FFF1E2',stroke:ORANGE,sw:.35},
    circArrow(x+h*.52,y+h/2,h*.26,.4,h*.28),
    {k:'text',x:x+h*.95,y:y+(h-s)/2-.1,w:w-h,h:s*1.3,s,text:'翻面',color:'#B8431F',bold:true}
  ];
}

// ---- 單一步驟圖
function diagram(model,step,bx,by,size,color){
  const vb=step.vb||model.vb;
  const s=size/Math.max(vb[2],vb[3]);
  const ox=bx+(size-vb[2]*s)/2-vb[0]*s, oy=by+(size-vb[3]*s)/2-vb[1]*s;
  const X=x=>ox+x*s, Y=y=>oy+y*s;
  const sw=Math.max(.3,Math.min(.6,size/160)), hs=Math.max(1.8,Math.min(3.4,size/30));
  const out=[];
  (step.sh||[]).forEach(([f,pts])=>out.push({k:'poly',pts:pts.map((v,i)=>i%2?Y(v):X(v)),fill:fillOf(f,color),stroke:'#3B3733',sw:sw*.7}));
  (step.ln||[]).forEach(([t,x1,y1,x2,y2])=>{
    out.push({k:'line',x1:X(x1),y1:Y(y1),x2:X(x2),y2:Y(y2),stroke:LINECOL[t],sw:t==='x'?sw*.55:t==='e'?sw*.6:sw*1.05,dash:DASH[t]?DASH[t].map(d=>d*Math.max(.7,size/90)):null,dn:DASHNAME[t]});
  });
  (step.dots||[]).forEach(([x,y,r])=>out.push({k:'circle',cx:X(x),cy:Y(y),r:r*s,fill:'#2A2622'}));
  (step.ar||[]).forEach(([x1,y1,x2,y2,b,k])=>out.push(arrowPrim(X(x1),Y(y1),X(x2),Y(y2),b,k,sw,hs)));
  if(step.flip){const fs=Math.max(3.2,Math.min(4.6,size/18));out.push(...flipBadge(bx+size-fs*4.2,by,fs));}
  return out;
}

// ---- 頁首、頁尾、圖例
function headerPrims(pr,title,sub,st){
  pr.push({k:'text',x:12,y:10,w:120,h:11,s:8.6,text:title,bold:true,color:INK});

  pr.push({k:'line',x1:12,y1:29,x2:198,y2:29,stroke:ORANGE,sw:.6});
  return 33;
}
function footerPrims(pr,right){
  pr.push({k:'text',x:12,y:287.5,w:100,h:4,s:3,text:'設計｜愛迪樂 鍾孟修 職能治療師',color:'#A0917F'});

function legendPrims(pr,x,y,w,fs,withFlip){
  const items=[['v','谷摺：往自己摺'],['m','山摺：往後摺'],['a','照箭頭方向摺']];
  if(withFlip) items.push(['f','翻到背面']);
  const iw=w/items.length, cy=y+fs*.65;
  items.forEach(([t,label],i)=>{
    const ix=x+i*iw;
    if(t==='v'||t==='m') pr.push({k:'line',x1:ix,y1:cy,x2:ix+11,y2:cy,stroke:LINECOL[t],sw:.6,dash:DASH[t],dn:DASHNAME[t]});
    if(t==='a') pr.push(arrowPrim(ix,cy+1.8,ix+11,cy+1,-.35,'f',.45,2));
    if(t==='f') pr.push(circArrow(ix+5,cy,2.3,.45,1.7));
    pr.push({k:'text',x:ix+13,y:y,w:iw-13,h:fs*1.3,s:fs,text:label,color:'#4A4238'});
  });
}

// ---- 步驟單
function stepPages(m,st){
  const per=st.per, cols=per===2?1:2, rows=per/cols, fs=st.fs==='XL'?7:5.6;
  const n=m.steps.length, total=Math.ceil(n/per), pages=[];
  const hasFlip=m.steps.some(s=>s.flip);
  for(let pi=0;pi<total;pi++){
    const pr=[]; const first=pi===0;
    let top=headerPrims(pr,`摺紙：${m.name}`,`${LV[m.lv]}｜共 ${n} 步`,st);
    if(first){legendPrims(pr,12,top,186,3.8,hasFlip);top+=9;}
    const bottom=284, gap=5, cw=(186-(cols-1)*gap)/cols, ch=(bottom-top-(rows-1)*gap)/rows;
    const cells=[];
    for(let k=0;k<per;k++){
      const si=pi*per+k; if(si>=n) break;
      const s=m.steps[si], r=Math.floor(k/cols), c=k%cols;
      const x=12+c*(cw+gap), y=top+r*(ch+gap);
      pr.push({k:'rect',x,y,w:cw,h:ch,r:3,stroke:'#E3CDB4',sw:.4});
      const txt=st.showText?s.t:(s.done?'完成！':'');
      const lines=txt?wrap(txt,cw-14,fs,true):[];
      const th=lines.length*fs*1.32;
      const avail=ch-12-(th?th+4:0);
      const size=Math.min(cw-20,avail);
      const dx=x+(cw-size)/2, dy=y+7+(avail-size)/2;
      pr.push(...diagram(m,s,dx,dy,size,st.color));
      pr.push({k:'circle',cx:x+7.5,cy:y+7.5,r:5,fill:ORANGE});
      pr.push({k:'text',x:x+2.5,y:y+7.5-2.9,w:10,h:6,s:5.4,text:String(si+1),color:'#FFFFFF',bold:true,align:'center'});
      if(txt) pr.push({k:'text',x:x+7,y:y+ch-5-th,w:cw-14,h:th,s:fs,text:txt,bold:true,color:INK,align:'center'});
      cells.push({si,x,y,w:cw,h:ch,size,txt,fs});
    }
    footerPrims(pr,`${m.name}　步驟單 ${pi+1}/${total}`);
    pages.push({type:'steps',model:m,first,hasFlip,cells,prims:pr,top,per,cols});
  }
  return pages;
}

// ---- 摺線紙
function creaseList(m,range){
  let list=m.cr.map(c=>{const [t,x1,y1,x2,y2,s]=c; if(m.frame==='d'){const a=d2s(x1,y1),b=d2s(x2,y2);return [t,a[0],a[1],b[0],b[1],s];} return c.slice();});
  if(range>0){const nums=[...new Set(list.map(c=>c[5]))].sort((a,b)=>a-b).slice(0,range);list=list.filter(c=>nums.includes(c[5]));}
  return list;
}
function paperPrims(m,x,y,w,h,st,big){
  const pr=[]; const bg=st.bg==='tint'?mix(st.color,'#FFFFFF',.8):'#FFFFFF';
  pr.push({k:'rect',x,y,w,h,fill:bg,stroke:'#555049',sw:.35});
  const k=w/(m.pw||100);
  const P=(a,b)=>[x+a*k,y+b*k];
  const lines=creaseList(m,st.range);
  const sw=big?.65:.55, dm=big?1.15:.95;
  lines.forEach(([t,x1,y1,x2,y2])=>{const a=P(x1,y1),b=P(x2,y2);pr.push({k:'line',x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:LINECOL[t],sw,dash:DASH[t].map(d=>d*dm),dn:DASHNAME[t]});});
  if(m.frame==='d'){
    const cs=big?12:9;
    pr.push({k:'poly',pts:[x,y,x+cs,y,x,y+cs],fill:AMBER,stroke:null});
    pr.push({k:'text',x:x+cs+1.5,y:y+1.4,w:40,h:5,s:big?3.6:3,text:'這個角朝上',color:'#C0521F',bold:true});
  }
  // 號碼
  const r=big?3.3:2.7, placed=[];
  const T=[.5,.36,.64,.26,.74,.18,.82];
  lines.forEach(([t,x1,y1,x2,y2,sn])=>{
    const a=P(x1,y1),b=P(x2,y2);
    let best=null;
    for(const tt of T){const cx=a[0]+(b[0]-a[0])*tt,cy=a[1]+(b[1]-a[1])*tt;
      if(cx<x+r+.5||cx>x+w-r-.5||cy<y+r+.5||cy>y+h-r-.5) continue;
      const d=Math.min(...placed.map(p=>Math.hypot(p[0]-cx,p[1]-cy)),99);
      if(d>r*2.4){best=[cx,cy];break;}
      if(!best||d>best[2]) best=[cx,cy,d];}
    if(!best) return;
    placed.push(best);
    pr.push({k:'circle',cx:best[0],cy:best[1],r,fill:'#FFFFFF',stroke:LINECOL[t],sw:.45});
    pr.push({k:'text',x:best[0]-r,y:best[1]-r*.62,w:r*2,h:r*1.4,s:r*1.15,text:String(sn),color:LINECOL[t],bold:true,align:'center'});
  });
  return pr;
}
function creasePage(m,st){
  const pr=[];
  const top=headerPrims(pr,`${m.name}｜摺線紙`,'沿外框剪下，印線的這一面朝上開始摺',st);
  const lp=[]; legendPrims(lp,12,top,186,3.8,false);
  // 第三個圖例換成號碼說明
  const keep=lp.filter(p=>!(p.k==='path')&&!(p.k==='text'&&p.text==='照箭頭方向摺'));
  pr.push(...keep);
  const nx=12+186/3*2;
  pr.push({k:'circle',cx:nx+3,cy:top+2.5,r:2.6,fill:'#FFFFFF',stroke:INK,sw:.4});
  pr.push({k:'text',x:nx+.4,y:top+.7,w:5.2,h:4,s:3,text:'1',color:INK,bold:true,align:'center'});
  pr.push({k:'text',x:nx+7.5,y:top,w:55,h:5,s:3.8,text:'號碼＝第幾步',color:'#4A4238'});
  const papers=[]; const y0=top+11, bottom=284;
  const pw=m.pw||100, ph=m.ph||100, H=bottom-y0;
  if(st.copies===1){const s=Math.min(180/pw,H/ph);papers.push([105-pw*s/2,y0+(H-ph*s)/2,pw*s,ph*s]);}
  else if(pw<ph){const s=Math.min(88/pw,(H-4)/ph),w=pw*s,h=ph*s,yy=y0+(H-h)/2;papers.push([12+(93-w)/2,yy,w,h],[105+(93-w)/2,yy,w,h]);}
  else{const s=Math.min(120/pw,(H-12)/2/ph),w=pw*s,h=ph*s,g=(H-2*h)/3;papers.push([105-w/2,y0+g,w,h],[105-w/2,y0+2*g+h,w,h]);}
  papers.forEach(p=>pr.push(...paperPrims(m,p[0],p[1],p[2],p[3],st,st.copies===1)));
  footerPrims(pr,`${m.name}　摺線紙`);
  return {type:'crease',model:m,papers,prims:pr,top};
}

function buildPages(st){
  const pages=[];
  MODELS.filter(m=>st.sel.has(m.id)).forEach(m=>{
    if(st.steps) pages.push(...stepPages(m,st));
    if(st.crease) pages.push(creasePage(m,st));
  });
  return pages;
}

// ---- 畫布
function drawPrims(ctx,prims,sc){
  ctx.lineJoin='round';
  for(const p of prims){
    ctx.save();
    const stroke=()=>{if(!p.stroke)return;ctx.strokeStyle=p.stroke;ctx.lineWidth=p.sw*sc;ctx.lineCap=p.dash?'butt':'round';ctx.setLineDash(p.dash?p.dash.map(d=>d*sc):[]);ctx.stroke();};
    if(p.k==='poly'){ctx.beginPath();for(let i=0;i<p.pts.length;i+=2){const f=i?'lineTo':'moveTo';ctx[f](p.pts[i]*sc,p.pts[i+1]*sc);}ctx.closePath();if(p.fill){ctx.fillStyle=p.fill;ctx.fill();}stroke();}
    else if(p.k==='line'){ctx.beginPath();ctx.moveTo(p.x1*sc,p.y1*sc);ctx.lineTo(p.x2*sc,p.y2*sc);stroke();}
    else if(p.k==='rect'){ctx.beginPath();if(p.r&&ctx.roundRect)ctx.roundRect(p.x*sc,p.y*sc,p.w*sc,p.h*sc,p.r*sc);else ctx.rect(p.x*sc,p.y*sc,p.w*sc,p.h*sc);if(p.fill){ctx.fillStyle=p.fill;ctx.fill();}stroke();}
    else if(p.k==='circle'){ctx.beginPath();ctx.arc(p.cx*sc,p.cy*sc,p.r*sc,0,Math.PI*2);if(p.fill){ctx.fillStyle=p.fill;ctx.fill();}stroke();}
    else if(p.k==='path'){
      ctx.beginPath();const s0=p.segs[0];ctx.moveTo(s0[0]*sc,s0[1]*sc);
      for(const g of p.segs.slice(1)){if(g.length===2)ctx.lineTo(g[0]*sc,g[1]*sc);else ctx.quadraticCurveTo(g[0]*sc,g[1]*sc,g[2]*sc,g[3]*sc);}
      stroke();
      const last=p.segs[p.segs.length-1], prev=p.segs[p.segs.length-2];
      const ex=last[last.length-2],ey=last[last.length-1];
      const cx=last.length===4?last[0]:prev[prev.length-2], cy=last.length===4?last[1]:prev[prev.length-1];
      const ang=Math.atan2(ey-cy,ex-cx), L=p.hs, W=p.hs*.55;
      const bx=ex-L*Math.cos(ang), by=ey-L*Math.sin(ang);
      const lx=bx+W*Math.sin(ang), ly=by-W*Math.cos(ang), rx=bx-W*Math.sin(ang), ry=by+W*Math.cos(ang);
      ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(lx*sc,ly*sc);ctx.lineTo(ex*sc,ey*sc);ctx.lineTo(rx*sc,ry*sc);
      if(p.head==='fill'){ctx.closePath();ctx.fillStyle=p.stroke;ctx.fill();}
      else{ctx.strokeStyle=p.stroke;ctx.lineWidth=p.sw*sc;ctx.lineCap='round';ctx.stroke();}
    }
    else if(p.k==='text'){
      ctx.font=fontStr(p.s*sc,p.bold);ctx.fillStyle=p.color||INK;ctx.textBaseline='middle';
      const lines=p.w?wrap(p.text,p.w,p.s,p.bold):[p.text];const lh=p.s*1.32;
      lines.forEach((ln,i)=>{let x=p.x;ctx.textAlign='left';
        if(p.align==='center'){x=p.x+p.w/2;ctx.textAlign='center';}else if(p.align==='right'){x=p.x+p.w;ctx.textAlign='right';}
        ctx.fillText(ln,x*sc,(p.y+lh*i+lh/2)*sc);});
    }
    ctx.restore();
  }
}
function pageCanvas(page,sc){
  const c=document.createElement('canvas');c.width=Math.round(210*sc);c.height=Math.round(297*sc);
  const ctx=c.getContext('2d');ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,c.width,c.height);drawPrims(ctx,page.prims,sc);return c;
}
function primsCanvas(prims,w,h,sc,bg){
  const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
  const ctx=c.getContext('2d');if(bg){ctx.fillStyle=bg;ctx.fillRect(0,0,c.width,c.height);}drawPrims(ctx,prims,sc);return c;
}
function shiftPrims(prims,dx,dy){
  return prims.map(p=>{const q={...p};
    if(p.k==='poly')q.pts=p.pts.map((v,i)=>v+(i%2?dy:dx));
    else if(p.k==='line'){q.x1+=dx;q.x2+=dx;q.y1+=dy;q.y2+=dy;}
    else if(p.k==='circle'){q.cx+=dx;q.cy+=dy;}
    else if(p.k==='path')q.segs=p.segs.map(g=>g.map((v,i)=>v+(i%2?dy:dx)));
    else{q.x+=dx;q.y+=dy;}
    return q;});
}

const IN=mm=>mm/25.4, PT=mm=>mm*2.8346;
const hx=c=>c.replace('#','').toUpperCase();
const PFONT='Microsoft JhengHei';

function pptPrim(pptx,sl,p){
  const SH=pptx.ShapeType;
  const ln=()=>p.stroke?Object.assign({color:hx(p.stroke),width:PT(p.sw)},p.dn?{dashType:p.dn}:{}):{type:'none'};
  if(p.k==='poly'||p.k==='line'||p.k==='path'){
    let pts=[];
    if(p.k==='poly') for(let i=0;i<p.pts.length;i+=2) pts.push([p.pts[i],p.pts[i+1]]);
    else if(p.k==='line') pts=[[p.x1,p.y1],[p.x2,p.y2]];
    else p.segs.forEach(g=>{for(let i=0;i<g.length;i+=2) pts.push([g[i],g[i+1]]);});
    const xs=pts.map(a=>a[0]),ys=pts.map(a=>a[1]);
    const bx=Math.min(...xs),by=Math.min(...ys),bw=Math.max(Math.max(...xs)-bx,.3),bh=Math.max(Math.max(...ys)-by,.3);
    const R=(x,y)=>({x:IN(x-bx),y:IN(y-by)});
    let points=[];
    if(p.k==='poly'){for(let i=0;i<p.pts.length;i+=2)points.push(R(p.pts[i],p.pts[i+1]));points.push({close:true});}
    else if(p.k==='line') points=[R(p.x1,p.y1),R(p.x2,p.y2)];
    else p.segs.forEach((g,i)=>{if(i===0||g.length===2)points.push(R(g[0],g[1]));else{const e=R(g[2],g[3]),c=R(g[0],g[1]);points.push({x:e.x,y:e.y,curve:{type:'quadratic',x1:c.x,y1:c.y}});}});
    const line=ln();
    if(p.k==='path'){line.endArrowType=p.head==='open'?'arrow':'triangle';}
    const opt={x:IN(bx),y:IN(by),w:IN(bw),h:IN(bh),points,line};
    opt.fill=(p.k==='poly'&&p.fill)?{color:hx(p.fill)}:{color:'FFFFFF',transparency:100};
    sl.addShape(SH.custGeom,opt);
  }else if(p.k==='circle'){
    sl.addShape(SH.ellipse,{x:IN(p.cx-p.r),y:IN(p.cy-p.r),w:IN(p.r*2),h:IN(p.r*2),fill:p.fill?{color:hx(p.fill)}:{color:'FFFFFF',transparency:100},line:ln()});
  }else if(p.k==='rect'){
    sl.addShape(p.r?SH.roundRect:SH.rect,Object.assign({x:IN(p.x),y:IN(p.y),w:IN(p.w),h:IN(p.h),fill:p.fill?{color:hx(p.fill)}:{color:'FFFFFF',transparency:100},line:ln()},p.r?{rectRadius:Math.min(.5,p.r/Math.min(p.w,p.h))}:{}));
  }else if(p.k==='text'){
    const lines=p.w?wrap(p.text,p.w,p.s,p.bold).length:1;
    sl.addText(p.text,{x:IN(p.x-.5),y:IN(p.y),w:IN((p.w||60)+1),h:IN(Math.max(p.h||0,lines*p.s*1.32)),fontFace:PFONT,fontSize:+PT(p.s).toFixed(1),color:hx(p.color||INK),bold:!!p.bold,align:p.align||'left',valign:'top',margin:0,lineSpacingMultiple:1.05});
  }
}
async function exportPPT(pages){

// ===== 動畫帶領（依摺紙模擬播放，正反面與層次都正確）=====
const PL={m:null,k:0,seq:null,raf:0,slow:false,sound:true,S:null,canvas:null,ctx:null,done:false,vb:null,vbFrom:null};
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function fillOfF(f){return f.fill||(f.up?'w':'c');}
function stepScript(m,k){
  const s=m.steps[k];
  if(s.done) return [{type:'celebrate'}];
  const ops=m.sim[k].ops,segs=[];
  const leadFlip=ops[0]&&ops[0][0]==='flip';
  segs.push({type:'show',lines:!leadFlip});
  ops.forEach((op,i)=>{
    if(op[0]==='flip'){segs.push({type:'flip'});if(i===0&&ops.length>1)segs.push({type:'show',lines:true,short:1});}
    else if(op[0]==='rot') segs.push({type:'rot',deg:op[1]});
    else if(op[0]==='f') segs.push({type:'fold',op});
    else if(op[0]==='key') segs.push({type:'key',shapes:op[1]});
  });
  return segs;
}
function segDur(seg,n){
  const b={show:seg.short?.6:1.1,fold:n>2?.95:1.35,flip:1.2,rot:1,key:1.1,celebrate:2.6}[seg.type];
  return b*(PL.slow?1.7:1)*(seg.type==='fold'&&seg.op[8]&&seg.op[8].unfold?1.5:1);
}
function vbOf(m,s){return (s&&s.vb)||m.vb;}
function lerpVb(a,b,t){return a.map((v,i)=>v+(b[i]-v)*t);}
function drawLayer(ctx,m,like,alpha,size,ox,oy,sc){
  if(alpha<=0.001) return;
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(ox*sc,oy*sc);
  drawPrims(ctx,diagram(m,like,0,0,size,st.color).filter(p=>!(p.k==='rect'||(p.k==='text'&&p.text==='翻面')||(p.k==='path'&&p.stroke===ORANGE))),sc);
  ctx.restore();
}
function paint(f){
  const c=PL.canvas,ctx=PL.ctx,W=c.width,H=c.height;
  ctx.clearRect(0,0,W,H);
  const size=100,sc=Math.min(W,H)/size*.94,ox=(W-size*sc)/2/sc,oy=(H-size*sc)/2/sc;
  f(ctx,size,ox,oy,sc);
}
function curVb(now){
  if(!PL.vbFrom) return PL.vb;
  const t=Math.min(1,(now-PL.vbT0)/600);if(t>=1){PL.vbFrom=null;return PL.vb;}
  return lerpVb(PL.vbFrom,PL.vb,ease(t));
}
function liveShapes(S){return stateShapes(S);}
function playStep(){
  cancelAnimationFrame(PL.raf);
  const m=PL.m,k=PL.k,s=m.steps[k];
  const nvb=vbOf(m,s);
  if(PL.vb&&PL.vb.join()!==nvb.join()){PL.vbFrom=PL.vb.slice();PL.vbT0=performance.now();} else PL.vbFrom=null;
  PL.vb=nvb;
  PL.S=cloneState(m.states[k]);
  PL.seq=stepScript(m,k);PL.si=0;PL.t0=performance.now();PL.done=false;
  updateUI();
  PL.raf=requestAnimationFrame(tick);
}
function tick(now){
  const m=PL.m,s=m.steps[PL.k],seg=PL.seq[PL.si];
  if(!seg){PL.done=true;renderIdle();updateUI();return;}
  const nF=PL.seq.filter(x=>x.type==='fold').length;
  const dur=segDur(seg,nF)*1000,t=Math.min(1,(now-PL.t0)/dur);
  const S=PL.S,vb=curVb(now);
  if(seg.type==='show'){
    const pulse=.55+.45*Math.abs(Math.sin(t*Math.PI*2));
    paint((ctx,size,ox,oy,sc)=>{
      drawLayer(ctx,m,{sh:liveShapes(S),ln:preLines(S),vb},1,size,ox,oy,sc);
      if(seg.lines) drawLayer(ctx,m,{sh:[],ln:s.ln.filter(l=>l[0]!=='x'),ar:s.ar,vb},pulse,size,ox,oy,sc);
    });
  }else if(seg.type==='fold'){
    if(!seg.r){seg.r=opFold(cloneState(S),seg.op,PL.k+1);if(PL.sound)setTimeout(()=>paperSound(),dur*.3);}
    const r=seg.r,op=seg.op,unf=op[8]&&op[8].unfold;
    const A=[op[1],op[2]],d=[op[3]-op[1],op[4]-op[2]],L=Math.hypot(d[0],d[1]),n=[-d[1]/L,d[0]/L];
    const tt=unf?(t<.45?ease(t/.45):t<.6?1:1-ease((t-.6)/.4)):ease(t);
    const k2=1-Math.cos(Math.PI*tt);
    const items=[];
    r.keep.forEach(f=>items.push({z:f.z,fill:fillOfF(f),pts:f.pts}));
    if(r.neu||unf){
      r.mov.forEach((f,i)=>{
        const q=[];for(let j=0;j<f.pts.length;j+=2){const sd=(f.pts[j]-A[0])*n[0]+(f.pts[j+1]-A[1])*n[1];q.push(f.pts[j]-n[0]*sd*k2,f.pts[j+1]-n[1]*sd*k2);}
        const after=tt>.5;
        const nz=r.neu?r.neu[i].z:(op[7]==='v'?1e6+f.z:-1e6-f.z);
        items.push({z:after?nz:f.z,fill:after?(f.fill?(f.back||swapFill(f.fill)):(f.up?'c':'w')):fillOfF(f),pts:q});
      });
    }
    items.sort((a,b)=>a.z-b.z);
    paint((ctx,size,ox,oy,sc)=>{
      drawLayer(ctx,m,{sh:items.map(x=>[x.fill,x.pts]),ln:preLines(S,r.keep),vb},1,size,ox,oy,sc);
      const seg2=s.ln.find(l=>l[0]===op[7]&&Math.abs(cr2(d[0],d[1],l[1]-A[0],l[2]-A[1]))<1e-3*L*L&&Math.abs(cr2(d[0],d[1],l[3]-A[0],l[4]-A[1]))<1e-3*L*L);

  }else if(seg.type==='flip'){
    if(!seg.S2){seg.S2=cloneState(S);seg.cx=opFlip(seg.S2);}
    const tt=ease(t),c=Math.cos(Math.PI*tt),cx=seg.cx;
    const src=tt<.5?S:seg.S2;
    const sh=src.f.slice().sort((a,b)=>a.z-b.z).map(f=>[fillOfF(f),f.pts.map((v,i)=>i%2?v:cx+(v-cx)*Math.abs(c))]);
    paint((ctx,size,ox,oy,sc)=>drawLayer(ctx,m,{sh,vb},1,size,ox,oy,sc));
    if(t>=1) PL.S=S===PL.S?seg.S2:PL.S;
  }else if(seg.type==='rot'){
    const b=bboxOf(S.f),cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2,a=seg.deg*Math.PI/180*ease(t),co=Math.cos(a),si=Math.sin(a);
    const sh=liveShapes(S).map(([f,p])=>[f,p.map((v,i)=>i%2?cy+(p[i-1]-cx)*si+(v-cy)*co:cx+(v-cx)*co-(p[i+1]-cy)*si)]);
    paint((ctx,size,ox,oy,sc)=>drawLayer(ctx,m,{sh,vb},1,size,ox,oy,sc));
    if(t>=1) opRot(S,seg.deg);
  }else if(seg.type==='key'){
    const tt=ease(t);
    paint((ctx,size,ox,oy,sc)=>{
      drawLayer(ctx,m,{sh:liveShapes(S),vb},1-tt,size,ox,oy,sc);
      drawLayer(ctx,m,{sh:seg.shapes.map(x=>[x[0],x[1]]),vb},tt,size,ox,oy,sc);
    });
    if(t>=1) opKey(S,seg.shapes);
  }else if(seg.type==='celebrate'){
    const pop=t<.3?.85+.25*ease(t/.3):1.1-.1*ease(Math.min(1,(t-.3)/.3));
    paint((ctx,size,ox,oy,sc)=>{
      ctx.save();const c=size/2;ctx.translate((ox+c)*sc,(oy+c)*sc);ctx.scale(pop,pop);ctx.translate(-(ox+c)*sc,-(oy+c)*sc);
      drawLayer(ctx,m,{sh:s.sh,ln:s.ln,dots:s.dots,vb},1,size,ox,oy,sc);ctx.restore();
      confetti(ctx,t,PL.canvas.width,PL.canvas.height);
    });
    if(!seg.chimed&&PL.sound){seg.chimed=1;chime();}
  }
  if(t>=1){PL.si++;PL.t0=now;}
  PL.raf=requestAnimationFrame(tick);
}
const CONF=Array.from({length:46},(_,i)=>({x:Math.random(),d:.15+Math.random()*.5,s:.6+Math.random(),r:Math.random()*6,c:['#E8552D','#F4A93C','#7FB8EA','#F4A3B8','#9ED08A','#B9A3E3'][i%6]}));
function confetti(ctx,t,W,H){
  CONF.forEach(p=>{const y=(-.1+t*1.3*p.s)*H,x=(p.x+Math.sin(t*6+p.r)*.03)*W;if(y<0||y>H)return;
    ctx.save();ctx.translate(x,y);ctx.rotate(p.r+t*5);ctx.fillStyle=p.c;const z=Math.min(W,H)*.018;ctx.beginPath();ctx.moveTo(-z,-z);ctx.lineTo(z,-z);ctx.lineTo(-z,z);ctx.closePath();ctx.fill();ctx.restore();});
}
function renderIdle(){
  const m=PL.m,s=m.steps[PL.k],vb=PL.vb;
  if(s.done){paint((ctx,size,ox,oy,sc)=>drawLayer(ctx,m,{sh:s.sh,ln:s.ln,dots:s.dots,vb},1,size,ox,oy,sc));return;}
  paint((ctx,size,ox,oy,sc)=>drawLayer(ctx,m,{sh:liveShapes(PL.S),ln:preLines(PL.S),vb},1,size,ox,oy,sc));
}
// ---- 音效
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function paperSound(){
  const a=ac();if(!a)return;const len=.28,buf=a.createBuffer(1,a.sampleRate*len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){const x=i/d.length;d[i]=(Math.random()*2-1)*Math.pow(1-x,2)*(x<.08?x/.08:1);}
  const src=a.createBufferSource();src.buffer=buf;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=.7;
  const g=a.createGain();g.gain.value=.35;src.connect(f).connect(g).connect(a.destination);src.start();
}
function chime(){
  const a=ac();if(!a)return;[[784,0],[988,.12],[1319,.24]].forEach(([fr,dt])=>{
    const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=fr;const t=a.currentTime+dt;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.9);
    o.connect(g).connect(a.destination);o.start(t);o.stop(t+1);});
}

// ---- 介面
function buildPlayer(){
  if(document.getElementById('player')) return;
  const d=document.createElement('div');d.id='player';d.hidden=true;
  d.innerHTML=`
  <div class="pl-top"><div class="pl-title" id="plTitle"></div><div class="pl-dots" id="plDots"></div>
    <div class="pl-tools"><button type="button" id="plSlow"></button><button type="button" id="plSound"></button><button type="button" id="plFull">全螢幕</button><button type="button" id="plClose">關閉</button></div></div>
  <div class="pl-main"><div class="pl-stage"><canvas id="plCanvas"></canvas></div>
    <div class="pl-side"><div class="pl-num" id="plNum"></div><div class="pl-text" id="plText"></div>
      <div class="pl-legend"><span><i class="lv"></i>谷摺：往自己摺</span><span><i class="lm"></i>山摺：往後摺</span></div></div></div>
  <div class="pl-bottom"><button type="button" class="pl-btn" id="plPrev">上一步</button><button type="button" class="pl-btn" id="plReplay">重播</button><button type="button" class="pl-btn main" id="plNext">下一步</button></div>`;
  document.body.appendChild(d);
  PL.canvas=document.getElementById('plCanvas');PL.ctx=PL.canvas.getContext('2d');
  document.getElementById('plPrev').onclick=()=>go(-1);
  document.getElementById('plNext').onclick=()=>go(1);
  document.getElementById('plReplay').onclick=()=>{ac();playStep();};
  document.getElementById('plClose').onclick=closePlayer;
  document.getElementById('plSlow').onclick=()=>{PL.slow=!PL.slow;updateUI();};
  document.getElementById('plSound').onclick=()=>{PL.sound=!PL.sound;if(PL.sound)ac();updateUI();};
  document.getElementById('plFull').onclick=()=>{const e=document.getElementById('player');if(document.fullscreenElement)document.exitFullscreen();else if(e.requestFullscreen)e.requestFullscreen().catch(()=>{});};
  window.addEventListener('keydown',e=>{
    if(document.getElementById('player').hidden) return;
    if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(1);}
    else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1);}
    else if(e.key==='r'||e.key==='R'){playStep();}
    else if(e.key==='Escape'&&!document.fullscreenElement){closePlayer();}
  });
  window.addEventListener('resize',()=>{if(!document.getElementById('player').hidden){sizeCanvas();if(PL.done)renderIdle();}});
  document.addEventListener('fullscreenchange',()=>setTimeout(()=>{sizeCanvas();if(PL.done)renderIdle();},60));
}
function sizeCanvas(){
  const box=PL.canvas.parentElement.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  PL.canvas.width=Math.max(10,Math.round(box.width*dpr));PL.canvas.height=Math.max(10,Math.round(box.height*dpr));
  PL.canvas.style.width=box.width+'px';PL.canvas.style.height=box.height+'px';
}
function go(dir){
  ac();const n=PL.m.steps.length;const k=PL.k+dir;
  if(k<0||k>=n){if(dir>0&&!PL.done){cancelAnimationFrame(PL.raf);PL.si=PL.seq.length;finishNow();}return;}
  PL.k=k;playStep();
}
function finishNow(){
  const m=PL.m;
  if(m.states[PL.k+1]) PL.S=cloneState(m.states[PL.k+1]);
  PL.done=true;renderIdle();updateUI();
}
function updateUI(){
  const m=PL.m,s=m.steps[PL.k],n=m.steps.length;
  document.getElementById('plTitle').textContent=`摺紙：${m.name}`;
  document.getElementById('plNum').textContent=s.done?'完成！':`第 ${PL.k+1} 步`;
  document.getElementById('plText').textContent=s.done?s.t.replace(/^完成！/,''):s.t;
  document.getElementById('plDots').innerHTML=m.steps.map((_,i)=>`<i class="${i<PL.k?'past':i===PL.k?'now':''}"></i>`).join('')+`<span>${PL.k+1} / ${n}</span>`;
  document.getElementById('plSlow').textContent=PL.slow?'速度：慢':'速度：標準';
  document.getElementById('plSound').textContent=PL.sound?'音效：開':'音效：關';
  document.getElementById('plPrev').disabled=PL.k===0;
  const nx=document.getElementById('plNext');nx.disabled=PL.k===n-1;nx.classList.toggle('ready',PL.done&&PL.k<n-1);
}
function openPlayer(id){
  buildPlayer();PL.m=MODELS.find(x=>x.id===id);PL.k=0;
  const el=document.getElementById('player');el.hidden=false;document.body.style.overflow='hidden';
  requestAnimationFrame(()=>{sizeCanvas();playStep();});
}
function closePlayer(){cancelAnimationFrame(PL.raf);if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});document.getElementById('player').hidden=true;document.body.style.overflow='';}

// ===== 介面 =====
const COLORS=[['天空藍','#7FB8EA'],['橘色','#F6A860'],['粉紅','#F4A3B8'],['草綠','#9ED08A'],['紫色','#B9A3E3'],['黃色','#F7D35C']];
const st={sel:new Set(['dog']),steps:true,crease:true,per:4,fs:'L',showText:true,copies:1,bg:'white',range:0,color:'#7FB8EA',unit:'',namebox:true};
let pages=[];

function el(tag,attrs={},html){const e=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>{if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);});if(html!==undefined)e.innerHTML=html;return e;}

function thumb(m,px){
  const done=m.steps[m.steps.length-1];
  const prims=diagram(m,done,1,1,18,st.color).filter(p=>p.k!=='path'&&!(p.k==='rect'));
  const c=primsCanvas(prims,20,20,px/20*(window.devicePixelRatio||1),null);
  c.style.width=px+'px';c.style.height=px+'px';return c;
}
function renderModels(){
  const box=document.getElementById('models');box.innerHTML='';
  [1,2,3].forEach(lv=>{
    const g=el('div',{class:'lvgroup'});
    g.appendChild(el('div',{class:'lvhead'},`<span>${LV[lv]}</span>`));
    const grid=el('div',{class:'mgrid'});
    MODELS.filter(m=>m.lv===lv).forEach(m=>{
      const b=el('button',{class:'mcard'+(st.sel.has(m.id)?' on':''),type:'button','aria-pressed':st.sel.has(m.id)});
      b.appendChild(thumb(m,52));
      b.appendChild(el('span',{class:'mname'},m.name));
      b.appendChild(el('span',{class:'msteps'},`${m.steps.length} 步`));
      b.addEventListener('click',()=>{st.sel.has(m.id)?st.sel.delete(m.id):st.sel.add(m.id);renderModels();renderPlayList();refresh();});
      grid.appendChild(b);
    });
    g.appendChild(grid);box.appendChild(g);
  });
}
function renderPlayList(){
  const box=document.getElementById('playList');box.innerHTML='';
  const ms=MODELS.filter(m=>st.sel.has(m.id));
  if(!ms.length){box.appendChild(el('div',{class:'hint2',style:'margin:0'},'先在上面選一個作品。'));return;}
  ms.forEach(m=>{const b=el('button',{type:'button',class:'playb'},`▶ ${m.name}`);b.addEventListener('click',()=>openPlayer(m.id));box.appendChild(b);});
  const top=document.getElementById('playTop');top.innerHTML='';
  ms.slice(0,6).forEach(m=>{const b=el('button',{type:'button',class:'playb'},`▶ ${m.name} 動畫帶領`);b.addEventListener('click',()=>openPlayer(m.id));top.appendChild(b);});
}
function seg(id,key,opts,cast){
  const box=document.getElementById(id);box.innerHTML='';
  opts.forEach(([v,label])=>{
    const b=el('button',{type:'button',class:'segb'+(st[key]===v?' on':'')},label);
    b.addEventListener('click',()=>{st[key]=v;seg(id,key,opts,cast);refresh();});
    box.appendChild(b);
  });
}
function renderColors(){
  const box=document.getElementById('colors');box.innerHTML='';
  COLORS.forEach(([n,c])=>{
    const b=el('button',{type:'button',class:'sw'+(st.color===c?' on':''),title:n,'aria-label':n});
    b.style.setProperty('--c',c);b.appendChild(el('span',{},n));
    b.addEventListener('click',()=>{st.color=c;renderColors();renderModels();refresh();});
    box.appendChild(b);
  });
}
function syncVis(){
  document.getElementById('stepOpts').hidden=!st.steps;
  document.getElementById('creaseOpts').hidden=!st.crease;
}

let _rt=null, _gen=0;
function refresh(){clearTimeout(_rt);_rt=setTimeout(doRender,120);}
async function ensureFonts(){
  const txt=Array.from(new Set(pages.flatMap(p=>p.prims.filter(q=>q.k==='text').map(q=>q.text)).join('')+'0123456789')).join('');
  try{await Promise.all([document.fonts.load(`700 20px "Noto Sans TC"`,txt),document.fonts.load(`400 20px "Noto Sans TC"`,txt)]);}catch(e){}
}
async function doRender(){
  syncVis();
  const gen=++_gen;
  pages=buildPages(st);
  const wrapEl=document.getElementById('pages');
  document.getElementById('pcount').textContent=pages.length?`共 ${pages.length} 頁`:'';
  document.querySelectorAll('.dlb').forEach(b=>b.disabled=!pages.length);
  if(!pages.length){wrapEl.innerHTML='<div class="empty">左邊選一個作品，並勾選要印的頁面，預覽就會出現在這裡。</div>';return;}
  await ensureFonts();
  if(gen!==_gen) return;
  pages=buildPages(st);
  wrapEl.innerHTML='';
  const cssW=Math.min(wrapEl.clientWidth-8,600);
  const dpr=window.devicePixelRatio||1;
  for(let i=0;i<pages.length;i++){
    if(gen!==_gen) return;
    const fig=el('figure',{class:'sheet'});
    const c=pageCanvas(pages[i],cssW/210*dpr);
    c.style.width=cssW+'px';c.style.height=(cssW*297/210)+'px';
    fig.appendChild(c);
    fig.appendChild(el('figcaption',{},`${i+1} / ${pages.length}　${pages[i].model.name}・${pages[i].type==='steps'?'步驟單':'摺線紙'}`));
    wrapEl.appendChild(fig);
    if(i%2===1) await new Promise(r=>requestAnimationFrame(r));
  }
}

function fname(ext){
  const names=MODELS.filter(m=>st.sel.has(m.id)).map(m=>m.name);
  const n=names.length>3?names.slice(0,3).join('、')+'等':names.join('、');
  return `摺紙紙本_${n}.${ext}`;
}
async function runExport(kind,btn){
  const status=document.getElementById('status');
  document.querySelectorAll('.dlb').forEach(b=>b.disabled=true);
  const label=btn.querySelector('b').textContent;
  status.textContent=`正在製作 ${label}…`;
  try{
    await ensureFonts();
    const pg=buildPages(st);
    let blob;
    if(kind==='pptx') blob=await exportPPT(pg);
    else if(kind==='docx') blob=await exportWord(pg,st,(a,b)=>status.textContent=`正在製作 Word… ${a}/${b} 頁`);
    else blob=await exportPDF(pg,(a,b)=>status.textContent=`正在製作 PDF… ${a}/${b} 頁`);
    status.textContent='檔案準備好了，請確認下載。';
    await saveFile(blob,fname(kind));
    status.textContent=`${label} 已下載。`;
  }catch(e){
    const code=e&&e.code;
    status.textContent=code==='declined'?'已取消下載。':code==='rate_limited'?'下載視窗還開著，請先處理後再按一次。':`沒有下載成功：${(e&&e.message)||e}`;
    console.error(e);
  }finally{document.querySelectorAll('.dlb').forEach(b=>b.disabled=!pages.length);}
}

function init(){
  renderModels();renderColors();renderPlayList();
  seg('perSeg','per',[[2,'2 步'],[4,'4 步'],[6,'6 步']]);
  seg('fsSeg','fs',[['L','大'],['XL','特大']]);
  seg('txtSeg','showText',[[true,'顯示說明'],[false,'只看圖']]);
  seg('copySeg','copies',[[1,'1 張（18 公分）'],[2,'2 張（12 公分）']]);
  seg('bgSeg','bg',[['white','白色'],['tint','淺色']]);
  seg('rangeSeg','range',[[0,'全部'],[1,'只印第 1 步'],[2,'前 2 步'],[3,'前 3 步']]);
  const ck=(id,key)=>{const e=document.getElementById(id);e.checked=st[key];e.addEventListener('change',()=>{st[key]=e.checked;refresh();});};
  ck('ckSteps','steps');ck('ckCrease','crease');ck('ckName','namebox');
  document.getElementById('unit').addEventListener('input',e=>{st.unit=e.target.value.trim();refresh();});
  document.getElementById('selAll').addEventListener('click',()=>{MODELS.forEach(m=>st.sel.add(m.id));renderModels();renderPlayList();refresh();});
  document.getElementById('selNone').addEventListener('click',()=>{st.sel.clear();renderModels();renderPlayList();refresh();});
  document.querySelectorAll('.dlb').forEach(b=>b.addEventListener('click',()=>runExport(b.dataset.k,b)));
  let rw=null;window.addEventListener('resize',()=>{clearTimeout(rw);rw=setTimeout(refresh,250);});
  refresh();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{renderModels();refresh();});
}
document.addEventListener('DOMContentLoaded',init);

</script>
